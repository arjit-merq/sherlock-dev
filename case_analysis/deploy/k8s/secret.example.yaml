# Example Kubernetes Secret for Sherlock (POC).
# Replace placeholder values before apply. Never commit real secrets to git.
#
#   kubectl -n airflow apply -f secret.example.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: sherlock-secrets
  namespace: airflow
type: Opaque
stringData:
  CURSOR_API_KEY: "REPLACE_WITH_TEAM_SERVICE_ACCOUNT_KEY"
  JIRA_BASE_URL: "https://merqube.atlassian.net"
  JIRA_EMAIL: "REPLACE_WITH_BOT_EMAIL"
  JIRA_API_TOKEN: "REPLACE_WITH_BOT_TOKEN"
  MERQ_CREDS_JSON: |
    {"apikey": "REPLACE_OR_USE_SERVICE_CREDENTIAL_JSON"}
  SHERLOCK_S3_BUCKET: "REPLACE_WITH_APPROVED_BUCKET"
  SHERLOCK_S3_PREFIX: "sherlock"
  CASE_ANALYSIS_MODEL: "auto"
  CASE_ANALYSIS_SKIP_DISTILL: "1"
  CASE_ANALYSIS_SLACK: "0"
  CASE_ANALYSIS_SKIP_SYNC: "1"
  CASE_ANALYSIS_PREFLIGHT_STRICT: "1"
